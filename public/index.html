<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<title>MemoAle &mdash; Agenda Clienti</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f172a;--surface:#1e293b;--card:#334155;--border:#475569;--text:#f1f5f9;--dim:#94a3b8;--accent:#6366f1;--accent-hover:#818cf8;--green:#22c55e;--red:#ef4444;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding-bottom:80px;-webkit-tap-highlight-color:transparent}
.header{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;backdrop-filter:blur(12px)}
.header .logo{width:36px;height:36px;flex-shrink:0}
.header h1{font-size:18px;font-weight:600;flex:1}
.header .sub{font-size:11px;color:var(--dim)}
.header-actions{display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-outline:hover{background:var(--card)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-icon{width:36px;height:36px;padding:0;border-radius:8px;font-size:18px;line-height:1}
.btn-danger{color:var(--red)}.btn-danger:hover{background:rgba(239,68,68,.15)}
.btn-green{color:var(--green)}
.view{display:none;padding:16px;max-width:600px;margin:0 auto}
.view.active{display:block}
.client-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.client-card-header{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.client-card-header .avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0;color:#fff}
.client-card-header .info{flex:1}
.client-card-header .info h3{font-size:15px;font-weight:500}
.client-card-header .info .count{font-size:11px;color:var(--dim)}
.client-card-header .arrow{color:var(--dim);font-size:18px;transition:transform .2s}
.client-card.open .arrow{transform:rotate(180deg)}
.projects-wrap{display:none;border-top:1px solid var(--border);padding:12px 16px}
.client-card.open .projects-wrap{display:block}
.project-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-radius:8px;margin-bottom:8px}
.project-item:last-child{margin-bottom:0}
.project-item .p-info{flex:1;min-width:0}
.project-item .p-name{font-size:13px;font-weight:500}
.project-item .p-links{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.project-item .p-links a{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--accent);text-decoration:none;padding:3px 8px;background:rgba(99,102,241,.1);border-radius:4px}
.project-item .p-links a:hover{background:rgba(99,102,241,.25)}
.project-item .p-links a svg{width:12px;height:12px;flex-shrink:0}
.project-actions{display:flex;gap:4px;flex-shrink:0}
.empty{text-align:center;padding:48px 16px;color:var(--dim)}
.empty svg{width:48px;height:48px;margin-bottom:12px;opacity:.4}
.empty h3{font-size:16px;margin-bottom:6px;color:var(--text)}
.empty p{font-size:13px}
.modal-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;padding:20px;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px;font-weight:500}
.form-group input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;outline:none}
.form-group input:focus{border-color:var(--accent)}
.form-group input::placeholder{color:var(--dim);opacity:.6}
.form-row{display:flex;gap:8px}
.form-row .form-group{flex:1}
.footer{text-align:center;padding:24px 16px;font-size:11px;color:var(--dim);border-top:1px solid var(--border);margin-top:16px}
.footer strong{color:var(--text)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--text);padding:10px 20px;border-radius:8px;border:1px solid var(--border);font-size:13px;box-shadow:var(--shadow);z-index:300;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<header class="header">
<svg class="logo" viewBox="0 0 100 100"><rect x="8" y="8" width="84" height="84" rx="14" fill="#334155"/><rect x="16" y="16" width="68" height="68" rx="8" fill="#1e293b"/><rect x="24" y="24" width="52" height="52" rx="4" fill="#f1f5f9"/><line x1="28" y1="36" x2="72" y2="36" stroke="#cbd5e1" stroke-width="2.5"/><line x1="28" y1="46" x2="72" y2="46" stroke="#cbd5e1" stroke-width="2.5"/><line x1="28" y1="56" x2="62" y2="56" stroke="#cbd5e1" stroke-width="2.5"/><line x1="28" y1="66" x2="55" y2="66" stroke="#cbd5e1" stroke-width="2.5"/><path d="M62 26 L76 40 L64 52 L50 38 Z" fill="#6366f1"/></svg>
<div><h1>MemoAle</h1><div class="sub">Agenda Clienti</div></div>
<div class="header-actions"><button class="btn btn-primary btn-sm" onclick="openModal('client')">+ Cliente</button></div>
</header>

<div id="mainView" class="view active">
<div id="clientList"></div>
<div id="emptyState" class="empty">
<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/></svg>
<h3>Nessun cliente</h3><p>Aggiungi il primo cliente per iniziare</p>
</div>
<div class="footer">&copy; 2026 <strong>Alessandro Lorettu</strong> &mdash; MemoAle v1.0</div>
</div>

<div id="toast" class="toast"></div>

<div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this)closeModal()">
<div class="modal">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
<h2 id="modalTitle">Titolo</h2>
<button class="btn btn-icon btn-outline" onclick="closeModal()">&times;</button>
</div>
<div id="modalBody"></div>
</div>
</div>

<script>
var clients=[];
var editing=null;

var API={get:async function(u){var r=await fetch(u);if(!r.ok)throw await r.json();return r.json()},post:async function(u,b){var r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});var j=await r.json();if(!r.ok)throw j;return j},put:async function(u,b){var r=await fetch(u,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});var j=await r.json();if(!r.ok)throw j;return j},del:async function(u){var r=await fetch(u,{method:'DELETE'});var j=await r.json();if(!r.ok)throw j;return j}};

function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

async function load(){clients=await API.get('/api/clients');render()}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}

function toggleClient(el){el.classList.toggle('open')}

function delClient(id){
if(!confirm('Eliminare questo cliente e tutti i suoi progetti?'))return;
API.del('/api/clients/'+id).then(function(){load()}).catch(function(e){toast(e.error||'Errore')});
}

function delProject(cid,pid){
if(!confirm('Eliminare questo progetto?'))return;
API.del('/api/projects/'+pid).then(function(){load()}).catch(function(e){toast(e.error||'Errore')});
}

function render(){
var list=document.getElementById('clientList');
var empty=document.getElementById('emptyState');
if(!clients.length){list.innerHTML='';empty.style.display='block';return}
empty.style.display='none';
var html='';
for(var ci=0;ci<clients.length;ci++){
var c=clients[ci];
var i=c.name.charAt(0).toUpperCase();
var phtml='';
for(var pi=0;pi<(c.projects||[]).length;pi++){
var p=c.projects[pi];
var w=p.web_url?'<a href="'+esc(p.web_url)+'" target="_blank" rel="noopener"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0112 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 013 12c0-1.605.42-3.113 1.157-4.418"/></svg> Sito</a>':'';
var r=p.repo_url?'<a href="'+esc(p.repo_url)+'" target="_blank" rel="noopener"><svg fill="currentColor" viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 005.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.57 7.57 0 012 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8 8 0 0016 8c0-4.42-3.58-8-8-8z"/></svg> Repo</a>':'';
phtml+='<div class="project-item"><div class="p-info"><div class="p-name">'+esc(p.name)+'</div><div class="p-links">'+w+r+'</div></div><div class="project-actions"><button class="btn btn-sm btn-outline" onclick="event.stopPropagation();openModal(\'project\','+c.id+','+p.id+')">Modifica</button><button class="btn btn-sm btn-outline btn-danger" onclick="event.stopPropagation();delProject('+c.id+','+p.id+')">Elimina</button></div></div>';
}
html+='<div class="client-card'+(c.projects&&c.projects.length?' open':'')+'" onclick="toggleClient(this)"><div class="client-card-header"><div class="avatar">'+esc(i)+'</div><div class="info"><h3>'+esc(c.name)+'</h3><div class="count">'+(c.projects||[]).length+' progetti</div></div><div style="display:flex;gap:4px;flex-shrink:0" onclick="event.stopPropagation()"><button class="btn btn-sm btn-outline" onclick="event.stopPropagation();openModal(\'client\','+c.id+')">Modifica</button><button class="btn btn-sm btn-outline btn-danger" onclick="event.stopPropagation();delClient('+c.id+')">Elimina</button></div><span class="arrow">&#x25BE;</span></div><div class="projects-wrap"><button class="btn btn-sm btn-outline btn-green" onclick="event.stopPropagation();openModal(\'project\','+c.id+')" style="margin-bottom:10px">+ Progetto</button>'+phtml+'</div></div>';
}
list.innerHTML=html;
}

function openModal(type,clientId,projectId){
var overlay=document.getElementById('modalOverlay');
var title=document.getElementById('modalTitle');
var body=document.getElementById('modalBody');
editing=null;

if(type==='client'){
var isEdit=clientId!==undefined;
var c=isEdit?clients.find(function(x){return x.id===clientId}):null;
title.textContent=isEdit?'Modifica Cliente':'Nuovo Cliente';
body.innerHTML='<div class="form-group"><label>Nome cliente</label><input id="fClientName" type="text" value="'+esc(isEdit?c.name:'')+'" placeholder="es. Mario Rossi"></div><button class="btn btn-primary" onclick="saveClient('+(isEdit?clientId:'')+')">'+(isEdit?'Salva modifiche':'Aggiungi cliente')+'</button>';
overlay.classList.add('show');
setTimeout(function(){document.getElementById('fClientName').focus()},300);

}else if(type==='project'){
var isEdit=projectId!==undefined;
var c=clients.find(function(x){return x.id===clientId});
var p=isEdit?(c.projects||[]).find(function(x){return x.id===projectId}):null;
editing={clientId:clientId};
title.textContent=isEdit?'Modifica Progetto':'Nuovo Progetto per '+esc(c.name);
body.innerHTML='<div class="form-group"><label>Nome progetto</label><input id="fProjName" type="text" value="'+esc(isEdit?p.name:'')+'" placeholder="es. Sito Web Aziendale"></div><div class="form-group"><label>Link Sito Web</label><input id="fProjWeb" type="url" value="'+esc(isEdit?p.web_url:'')+'" placeholder="https://miosito.it"></div><div class="form-group"><label>Link Repository (Bitbucket)</label><input id="fProjRepo" type="url" value="'+esc(isEdit?p.repo_url:'')+'" placeholder="https://bitbucket.org/mio/repo"></div><button class="btn btn-primary" onclick="saveProject('+clientId+','+(isEdit?projectId:'')+')">'+(isEdit?'Salva modifiche':'Aggiungi progetto')+'</button>';
overlay.classList.add('show');
setTimeout(function(){document.getElementById('fProjName').focus()},300);
}
}

function closeModal(){
document.getElementById('modalOverlay').classList.remove('show');
editing=null;
}

async function saveClient(id){
var name=document.getElementById('fClientName').value.trim();
if(!name){alert('Inserisci il nome del cliente');return}
try{
if(id){await API.put('/api/clients/'+id,{name:name});toast('Cliente aggiornato')}
else{await API.post('/api/clients',{name:name});toast('Cliente creato')}
closeModal();load()
}catch(e){alert(e.error||'Errore')}
}

async function saveProject(clientId,projectId){
var name=document.getElementById('fProjName').value.trim();
var web=document.getElementById('fProjWeb').value.trim();
var repo=document.getElementById('fProjRepo').value.trim();
if(!name){alert('Inserisci il nome del progetto');return}
try{
if(projectId){await API.put('/api/projects/'+projectId,{name:name,web_url:web,repo_url:repo});toast('Progetto aggiornato')}
else{await API.post('/api/clients/'+clientId+'/projects',{name:name,web_url:web,repo_url:repo});toast('Progetto creato')}
closeModal();load()
}catch(e){alert(e.error||'Errore')}
}

// Register service worker
if('serviceWorker' in navigator){
navigator.serviceWorker.register('/sw.js').then(function(reg){console.log('SW registered',reg)}).catch(function(e){console.log('SW error',e)});
}

// Init
load();
</script>
</body>
</html>
